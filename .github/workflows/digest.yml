name: Weekly Technology Digest
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render only; do not send or write state
        type: boolean
        default: true
      force:
        description: Re-run even if this ISO week is already recorded
        type: boolean
        default: false
      week:
        description: ISO week, for example 2026-W45
        type: string
        required: false
permissions:
  contents: write
  issues: write
concurrency:
  group: digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Prepare digest-state worktree
        run: |
          if git ls-remote --exit-code origin refs/heads/digest-state >/dev/null 2>&1; then
            git fetch origin digest-state
            git worktree add --detach state-branch origin/digest-state
          else
            git worktree add --orphan -b digest-state state-branch
          fi
          mkdir -p state-branch/state state-branch/archive
      - name: Run digest
        id: run_digest
        env:
          DIGEST_STATE_DIR: state-branch/state
          ARCHIVE_DIR: state-branch/archive
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          FORCE_INPUT: ${{ inputs.force }}
          WEEK_INPUT: ${{ inputs.week }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN_INPUT" == "true" ]]; then
            command=(dry-run)
          else
            command=(run)
          fi
          args=()
          if [[ -n "$WEEK_INPUT" ]]; then args+=(--week "$WEEK_INPUT"); fi
          if [[ "$FORCE_INPUT" == "true" ]]; then args+=(--force); fi
          python -m digest "${command[@]}" "${args[@]}"
      - name: Upload rendered output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technology-digest-output
          path: out/
          if-no-files-found: warn
      - name: Commit state and archive to digest-state only
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: |
          git -C state-branch config user.name "github-actions[bot]"
          git -C state-branch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C state-branch add -A
          if ! git -C state-branch diff --cached --quiet; then
            git -C state-branch commit -m "Update digest state and archive"
            git -C state-branch push origin HEAD:digest-state
          fi
      - name: Build Pages site
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: |
          mkdir -p site
          cp state-branch/archive/*.html site/
          touch site/.nojekyll
      - name: Upload Pages artifact
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: digest
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v6.0.0
      - id: deployment
        uses: actions/deploy-pages@v4
