name: Source request
on:
  issues:
    types: [opened, edited, labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  propose:
    if: contains(github.event.issue.labels.*.name, 'source-request') || startsWith(github.event.issue.title, 'Add source:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-request label
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'source-request';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: '1d76db' });
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: context.issue.number, labels: [label]
            });
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Validate request and update source registry
        id: request
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python -m digest.registry_ops
      - name: Create pull request
        if: steps.request.outputs.valid == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: source/${{ steps.request.outputs.source_id }}
          commit-message: "Add requested digest source"
          title: "Add source: ${{ steps.request.outputs.source_title }}"
          body: |
            Adds a source requested in #${{ github.event.issue.number }}.
            Request reason: ${{ steps.request.outputs.source_reason }}

            Automated check: ${{ steps.request.outputs.validation }}
            Closes #${{ github.event.issue.number }}
          add-paths: config/sources.yaml
      - name: Report result to issue
        if: always()
        uses: actions/github-script@v7
        env:
          REQUEST_OUTCOME: ${{ steps.request.outcome }}
          REQUEST_VALID: ${{ steps.request.outputs.valid }}
          REQUEST_ERROR: ${{ steps.request.outputs.request_error }}
        with:
          script: |
            const note = process.env.REQUEST_VALID === 'true'
              ? 'The request passed validation. A pull request will be opened for review.'
              : `No pull request was opened. ${process.env.REQUEST_ERROR || 'Check the workflow logs and correct the form fields.'}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: note
            });
