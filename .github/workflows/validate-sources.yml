name: Validate source registry
on:
  pull_request:
    paths:
      - config/sources.yaml
      - config/sources.schema.json
permissions:
  contents: read
  pull-requests: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Validate source schema and live-check changed sources
        id: validate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m digest.validate_pr_sources
      - name: Post validation result
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_REPORT: ${{ steps.validate.outputs.report }}
        with:
          script: |
            const body = process.env.VALIDATION_REPORT || 'Source validation did not produce a report; inspect the workflow log.';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const marker = '<!-- source-validation-report -->';
            const existing = comments.data.find(comment => comment.body.includes(marker));
            const content = `${marker}\n## Source validation\n\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: content });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: content });
            }
